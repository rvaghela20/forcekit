name: orchestrator
version: "1.0"
description: "Lead orchestrator that plans tasks, delegates to specialized subagents, runs verification loops, and manages team coordination"

capabilities:
  - orchestration
  - code_review
  - static_analysis

context:
  required:
    - rules.md
    - conventions.md
    - architecture.md
    - governance.md
  optional:
    - source-of-truth.md
    - prompts/orchestration.md
    - prompts/smart-design.md

tools:
  - scan
  - lint
  - web-search
  - test
  - verify
  - deploy

constraints:
  maxFiles: 20
  allowedPaths:
    - "forcekit/"
    - "force-app/main/default/classes/"
    - "force-app/main/default/lwc/"
    - "force-app/main/default/triggers/"
  requireTests: false
  requireVerification: true

lifecycle:
  onStart:
    - load_context
    - verify_inventory
    - log_session_start
  onComplete:
    - run_linter
    - update_inventory
    - render_markdown
    - log_session_end
  onError:
    - log_blocker

qualityGates:
  - name: no-active-blockers
    required: true
  - name: inventory-updated
    required: true
  - name: session-documented
    required: true
